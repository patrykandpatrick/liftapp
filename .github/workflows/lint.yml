name: Lint
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - run: ./gradlew detektCheck
      - run: ./gradlew -p build-logic :convention:detektMain :convention:detektTest
