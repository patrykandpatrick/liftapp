config:
  validation: true

comments:
  active: false

complexity:
  active: false

naming:
  FunctionNameMaxLength:
    active: false
  FunctionNameMinLength:
    active: false
  VariableMaxLength:
    active: false
  VariableMinLength:
    active: false

potential-bugs:
  ImplicitUnitReturnType:
    ignoreAnnotated: ['Test']
  MissingUseCall:
    ignoreClass:
      - java.io.ByteArrayInputStream
      - java.io.ByteArrayOutputStream
      - java.io.StringReader
      - java.io.StringWriter
      - androidx.sqlite.db.SupportSQLiteDatabase
  PropertyUsedBeforeDeclaration:
    active: false

style:
  BracesOnIfStatements:
    active: false
  BracesOnWhenStatements:
    active: false
  CascadingCallWrapping:
    active: false
  ClassOrdering:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false
  EqualsOnSignatureLine:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  MagicNumber:
    active: false
  MaxChainedCallsOnSameLine:
    active: false
  MaxLineLength:
    active: false
  ModifierOrder:
    active: false
  MultilineLambdaItParameter:
    active: false
  MultilineRawStringIndentation:
    active: false
  NewLineAtEndOfFile:
    active: false
  NoTabs:
    active: false
  ReturnCount:
    active: false
  SpacingAfterPackageAndImports:
    active: false
  ThrowsCount:
    active: false
  TrailingWhitespace:
    active: false
  UnusedImport:
    active: false
  UnusedPrivateFunction:
    allowedNames: 'readResolve|.*Preview.*'

