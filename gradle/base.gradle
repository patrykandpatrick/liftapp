apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "kotlin-parcelize"
apply plugin: "dagger.hilt.android.plugin"
apply plugin: "com.google.devtools.ksp"

apply from: "$rootDir/gradle/versions.gradle"

android {
    compileSdk android.compileSdk

    defaultConfig {
        minSdk android.minSdk
        targetSdk android.targetSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    // Minification is configured by `:app` only. Enabling it here made every library module run
    // R8 independently, so several of them emitted a class named `a.a`, and the app's own R8 pass
    // then failed with "Type a.a is defined multiple times". Library modules that need to
    // contribute keep rules should use `consumerProguardFiles`.

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        freeCompilerArgs += [
                "-Xjvm-default=all-compatibility",
                "-opt-in=kotlin.RequiresOptIn",
                "-Xcontext-parameters",
                "-opt-in=kotlin.time.ExperimentalTime",
                "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
                "-opt-in=androidx.compose.animation.ExperimentalAnimationApi",
                "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi",
                "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                "-opt-in=androidx.compose.ui.ExperimentalComposeUiApi",
                "-opt-in=androidx.compose.ui.text.ExperimentalTextApi",
                "-opt-in=androidx.compose.ui.ExperimentalComposeUiApi",
                "-opt-in=androidx.lifecycle.viewmodel.compose.SavedStateHandleSaveableApi",
        ]
    }
}

kotlin {
    jvmToolchain(21)
}

