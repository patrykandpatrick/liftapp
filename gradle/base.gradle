apply plugin: "kotlin-parcelize"
apply plugin: "dagger.hilt.android.plugin"
apply plugin: "com.google.devtools.ksp"

apply from: "$rootDir/gradle/versions.gradle"

android {
    compileSdk android.compileSdk

    defaultConfig {
        minSdk android.minSdk
        targetSdk android.targetSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    // Minification is configured by `:app` only. Enabling it here made every library module run
    // R8 independently, so several of them emitted a class named `a.a`, and the app's own R8 pass
    // then failed with "Type a.a is defined multiple times". Library modules that need to
    // contribute keep rules should use `consumerProguardFiles`.

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

}

kotlin {
    jvmToolchain(21)

    // `kotlinOptions` was removed in AGP 9; this is the Kotlin Gradle plugin equivalent.
    // `-Xjvm-default=all-compatibility` is gone: since Kotlin 2.2 that behavior is the default.
    compilerOptions {
        freeCompilerArgs.add("-Xcontext-parameters")

        optIn.addAll(
                "kotlin.RequiresOptIn",
                "kotlin.time.ExperimentalTime",
                "kotlinx.coroutines.ExperimentalCoroutinesApi",
                "androidx.compose.animation.ExperimentalAnimationApi",
                "androidx.compose.foundation.ExperimentalFoundationApi",
                "androidx.compose.material3.ExperimentalMaterial3Api",
                "androidx.compose.ui.ExperimentalComposeUiApi",
                "androidx.compose.ui.text.ExperimentalTextApi",
                "androidx.lifecycle.viewmodel.compose.SavedStateHandleSaveableApi",
        )
    }
}
