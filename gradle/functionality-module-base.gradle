apply plugin: "com.android.library"
apply from: "$rootDir/gradle/base.gradle"

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

dependencies {

    implementation project(":domain")

    implementation libs.bundles.hilt
    implementation libs.bundles.kotlin
    implementation libs.timber

    ksp libs.hilt.compiler

    testImplementation libs.bundles.testing

    // These modules run on the JUnit Platform (see `useJUnitPlatform()` above), which needs the
    // engine and the launcher on the test runtime classpath. Without them Gradle 9 fails outright,
    // and Gradle 8 silently discovered no tests at all.
    testRuntimeOnly libs.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
}