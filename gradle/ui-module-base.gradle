apply from: "$rootDir/gradle/base.gradle"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

android {
    buildFeatures {
        compose true
    }

    // `packagingOptions` was renamed to `packaging`; the old name was removed in AGP 9.
    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

// `composeCompiler` is an extension of its own plugin rather than of `android`.
// `enableStrongSkippingMode` is gone: strong skipping has been on by default since Kotlin 2.0.20.
composeCompiler {
    def destination = layout.buildDirectory.dir("compose_compiler")
    reportsDestination = destination
    metricsDestination = destination
}

kotlin {
    sourceSets {
        debug {
            kotlin.srcDir("build/generated/ksp/debug/kotlin")
        }
        release {
            kotlin.srcDir("build/generated/ksp/release/kotlin")
        }
    }
}

dependencies {
    implementation project(":domain")
    implementation platform(libs.compose.bom)
    implementation libs.bundles.hilt
    implementation libs.bundles.ui
    implementation libs.activity
    implementation libs.appcompat
    implementation libs.lifecycle.runtime
    implementation libs.timber
    implementation libs.viewmodel

    debugImplementation libs.compose.ui.test.manifest
    debugImplementation libs.compose.ui.tooling

    testImplementation project(":domain-testing")
    testImplementation libs.bundles.testing

    ksp libs.hilt.compiler
    ksp libs.glide.ksp
}
